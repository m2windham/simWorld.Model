# The game's entire colour set. Every face of every model samples one cell of the atlas built
# from this file (tools/build_palette.py -> palette.png + palette.json). Change a colour here,
# rebuild the assets, and the whole world follows.
#
# Two registers (orders/MANIFEST.md, "Style: two registers"):
#   land        warm earth, low contrast, wide value spread per facet (soft, hand-made)
#   settlement  narrower, more saturated, tight value spread, with dark trim (abrupt, deliberate)
#
# Each swatch becomes `shades` cells, darkest to lightest, spread by +/- `spread` in value.
# Faces pick a shade with a bell-shaped weighting, so most faces sit near the base colour.

[atlas]
cell_px = 16
cols = 8
shades = 5
rows = 32   # fixed height (512 px) so adding a swatch never moves existing cells

[registers]
land = { spread = 0.10 }
settlement = { spread = 0.04 }

